# Pages CMS configuration
# Edit this site at https://app.pagescms.org
# Docs: https://pagescms.org/docs/

media:
  - name: project-images
    label: Project images
    input: src/assets/images
    # The output path is handled per-field (see hero/body image fields below)
    # so the path stored in the markdown matches what Astro expects.

content:
  # =========================================================================
  # NAVIGATION — top nav links + theme toggle visibility
  # =========================================================================
  - name: navigation
    label: Site navigation
    type: file
    path: src/data/navigation.json
    description: Top navigation links and visibility of the theme toggle.
    fields:
      - name: items
        label: Nav items
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: href, label: "Link (e.g. /projects/, /#about, https://…)", type: string }
      - name: showThemeToggle
        label: Show light/dark toggle in nav
        type: boolean

  # =========================================================================
  # SITE-WIDE SETTINGS — accent color, container width, etc.
  # =========================================================================
  - name: site-settings
    label: Site settings
    type: file
    path: src/data/site.json
    description: Site-wide visual settings (accent color, container width).
    fields:
      - name: accentColor
        label: Accent color
        type: string
        description: Used for buttons, links, project hover. Example - #c2410c (orange).
      - name: accentColorHover
        label: Accent color (hover)
        type: string
        description: Slightly darker shade for hovers. Example - #9a3412.
      - name: containerWidth
        label: Container width
        type: select
        description: How wide the content area can grow on big screens.
        options:
          values: [narrow, standard, wide]
      # Written by studio's theme panel. Listed here so editing site settings
      # in Pages CMS doesn't drop fields it doesn't know about.
      - name: accentSoft
        label: Accent tint
        type: string
        description: Pale wash behind accent elements. Derived from the accent in studio.
      - name: cornerStyle
        label: Corner style
        type: select
        description: How rounded cards, photos and buttons are.
        options:
          values: [sharp, soft, round]
      - name: headingFont
        label: Heading font
        type: select
        description: Typeface for headings. Body text always uses the sans stack.
        options:
          values: [sans, serif, mono]

  # =========================================================================
  # HOME PAGE
  # =========================================================================
  - name: home
    label: Home page
    type: file
    path: src/data/home.json
    description: Edit text and layout knobs for the home page.
    fields:
      - name: hero
        label: Hero (top of page)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow tag, type: string }
          - { name: tagline, label: Tagline (big quote under the name), type: string }
          - { name: lede, label: Lede (paragraph below tagline), type: text }
          - name: primaryCta
            label: Primary button
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - name: secondaryCta
            label: Secondary button
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: Link, type: string }
          - name: headshot
            label: Headshot
            type: image
            options:
              input: src/assets/images
              output: /src/assets/images/home/{name}{extension}
          - { name: headshotAlt, label: Headshot alt text, type: string }
          - name: headshotShape
            label: Headshot shape
            type: select
            description: Shape of your headshot photo at the top.
            options:
              values: [circle, square, rounded]

      - name: showcase
        label: Engineering photo collage
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - name: items
            label: Collage photos
            type: object
            list: true
            description: Drag to reorder. The grid reserves one Large cell and one Video cell.
            fields:
              - name: image
                label: Photo
                type: image
                options:
                  input: src/assets/images
                  output: /src/assets/images/home/{name}{extension}
              - { name: video, label: Video path (optional), type: string, description: "e.g. /videos/aero-testing.mp4 — set instead of a photo for a video cell." }
              - { name: alt, label: Alt text, type: string }
              - { name: focal, label: Crop position, type: string, description: "Set by dragging the photo in studio, e.g. 50% 40%." }
              - { name: zoom, label: Zoom, type: number, description: "Set in studio with ⌥-scroll. 1 = no zoom." }
              - name: size
                label: Cell size
                type: select
                options:
                  values: [large, regular, video]

      - name: projectsSection
        label: Projects section
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Heading, type: string }

      - name: experienceSection
        label: Experience section
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Heading, type: string }
          - name: logoSize
            label: Logo size
            type: select
            description: How tall the logo boxes are.
            options:
              values: [small, medium, large]
          - name: items
            label: Experience cards
            type: object
            list: true
            fields:
              - { name: role, label: Role, type: string }
              - { name: org, label: Organization, type: string }
              - { name: blurb, label: Blurb, type: text }
              - name: logo
                label: Logo
                type: image
                options:
                  input: src/assets/images
                  output: /src/assets/images/home/{name}{extension}
              - { name: dates, label: Dates, type: string, description: "e.g. Jan 2025 – Present. Left empty, nothing shows." }
              - { name: video, label: Banner video, type: string, description: "Set by studio's trim panel, e.g. /videos/experience-cfs.mp4." }
              - { name: videoSource, label: Full-length source video, type: string, description: "File in video-sources/ (local only). Set by studio." }
              - { name: videoStart, label: Trim start (s), type: number }
              - { name: videoEnd, label: Trim end (s), type: number }
              - { name: focal, label: Crop position, type: string, description: "Set by dragging the photo in studio, e.g. 50% 40%." }
              - { name: zoom, label: Zoom, type: number, description: "Set in studio with ⌥-scroll. 1 = no zoom." }

      - name: aboutSection
        label: About section
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - name: photo
            label: Portrait photo
            type: image
            options:
              input: src/assets/images
              output: /src/assets/images/home/{name}{extension}
          - { name: photoAlt, label: Portrait alt text, type: string }
          - { name: photoZoom, label: Portrait zoom, type: number, description: "Set in studio with ⌥-scroll. 1 = no zoom." }
          - name: photoPosition
            label: Photo position
            type: select
            description: Photo on the left or right side of the bio text.
            options:
              values: [left, right]
          - name: photoFocalPoint
            label: Photo crop position
            type: select
            description: Where to anchor the photo when it crops.
            options:
              values:
                [
                  'top-left',
                  'top',
                  'top-right',
                  'left',
                  'center',
                  'right',
                  'bottom-left',
                  'bottom',
                  'bottom-right',
                ]
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: lede, label: Lede (intro sentence), type: text }
          - name: bio
            label: Bio
            type: text
            description: Use a blank line between paragraphs.

      - name: interestsSection
        label: Interests section
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Heading, type: string }
          - name: items
            label: Interest cards
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - name: image
                label: Main photo
                type: image
                options:
                  input: src/assets/images
                  output: /src/assets/images/home/{name}{extension}
              - name: extraImages
                label: Extra thumbnail images
                type: image
                list: true
                description: Optional smaller photos shown below the main one.
                options:
                  input: src/assets/images
                  output: /src/assets/images/home/{name}{extension}
              - { name: alt, label: Alt text, type: string }
              - { name: body, label: Body, type: text }
              - { name: focal, label: Crop position, type: string, description: "Set by dragging the photo in studio, e.g. 50% 40%." }
              - { name: zoom, label: Zoom, type: number, description: "Set in studio with ⌥-scroll. 1 = no zoom." }
              - name: extraCrops
                label: Extra photo crops
                type: object
                list: true
                description: One per extra photo, in the same order. Set by dragging in studio.
                fields:
                  - { name: focal, label: Crop position, type: string }
                  - { name: zoom, label: Zoom, type: number }

      - name: contactSection
        label: Contact section
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: text }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone, type: string }

      # Section blocks added with studio's "+ Add section". Edit them in studio;
      # they're listed here so saving this page in the CMS keeps them.
      # Leave "Draft" on for anything not ready: drafts never reach the live site.
      - &blocks
        name: blocks
        label: Added sections
        type: object
        list: true
        description: Sections added in studio (cards, stats, quotes, timeline, gallery, video, banner…). Easiest to edit in studio.
        fields:
          - { name: id, label: ID (don't change), type: string }
          - name: type
            label: Section type
            type: select
            options:
              values: [banner, text, split, cards, stats, quote, steps, timeline, logos, faq, gallery, video, compare, tags, links, cta, marquee, spacer]
          - { name: draft, label: "Draft (hidden on the live site)", type: boolean, default: true }
          - { name: section, label: "Project heading it sits under (projects only)", type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: intro, label: Intro, type: text }
          - { name: body, label: Text, type: text }
          - { name: image, label: Photo path, type: string }
          - { name: video, label: Video path, type: string }
          - { name: compare, label: After photo path (before/after), type: string }
          - { name: beforeLabel, label: Before label, type: string }
          - { name: afterLabel, label: After label, type: string }
          - { name: split, label: Slider start (%), type: number }
          - { name: badge, label: Status pill, type: string }
          - { name: alt, label: Photo description, type: string }
          - { name: focal, label: Crop position, type: string }
          - { name: zoom, label: Zoom, type: number }
          - { name: url, label: "Video link (YouTube / Vimeo)", type: string }
          - { name: src, label: Video file, type: string }
          - { name: caption, label: Caption, type: string }
          - { name: words, label: "Scrolling words (comma separated)", type: text }
          - { name: size, label: Spacer height (px), type: number }
          - { name: anchor, label: "Anchor name (for #links)", type: string }
          - name: buttons
            label: Buttons
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: url, label: Link, type: string }
              - name: style
                label: Style
                type: select
                options:
                  values: [primary, secondary]
          - name: items
            label: Items
            type: object
            list: true
            description: Cards, stats, quotes, steps, entries, photos… Which fields matter depends on the section type.
            fields:
              - { name: title, label: Title, type: string }
              - { name: text, label: Text, type: text }
              - { name: image, label: Photo path, type: string }
              - { name: focal, label: Crop position, type: string }
              - { name: zoom, label: Zoom, type: number }
              - { name: url, label: Link, type: string }
              - { name: tag, label: Tag, type: string }
              - { name: value, label: Number, type: string }
              - { name: label, label: Label, type: string }
              - { name: name, label: Name, type: string }
              - { name: role, label: Role, type: string }
              - { name: q, label: Question, type: string }
              - { name: a, label: Answer, type: text }
              - { name: date, label: Dates, type: string }
              - { name: org, label: Organization, type: string }
              - { name: caption, label: Caption, type: string }
              - { name: alt, label: Photo description, type: string }
              - { name: tags, label: "Chips (comma separated)", type: text }
              - { name: source, label: Source, type: string }
              - { name: year, label: Year, type: string }
          - name: style
            label: Style
            type: object
            fields:
              - { name: bg, label: Background, type: select, options: { values: [none, subtle, accent, dark] } }
              - { name: width, label: Width, type: select, options: { values: [narrow, contained, wide, full] } }
              - { name: align, label: Alignment, type: select, options: { values: [left, center] } }
              - { name: columns, label: Columns, type: select, options: { values: ['1', '2', '3', '4'] } }
              - { name: variant, label: Look, type: select, options: { values: [cards, plain, numbered, overlay, grid, masonry, strip] } }
              - { name: side, label: Photo side, type: select, options: { values: [left, right] } }
              - { name: ratio, label: Photo width, type: select, options: { values: ['40', '50', '60'] } }
              - { name: height, label: Banner height, type: select, options: { values: [short, medium, tall, screen] } }
              - { name: shade, label: Darken photo, type: select, options: { values: ['0', '20', '40', '60', '80'] } }
              - { name: space, label: "Space around (projects)", type: select, options: { values: [tight, normal, loose] } }
              - { name: numbered, label: Numbered eyebrow, type: boolean }
              - { name: open, label: "Questions start expanded", type: boolean }
              - { name: line, label: Spacer divider line, type: boolean }
              - { name: countup, label: Count up on scroll, type: boolean }
              - { name: reveal, label: Fade in on scroll, type: boolean, default: true }
              - { name: padTop, label: "Space above (px, home)", type: number }
              - { name: padBottom, label: "Space below (px, home)", type: number }

      # Layout mode (studio, L): spacing, gaps, split and section order.
      - name: layout
        label: Layout (set in studio)
        type: object
        fields:
          - name: order
            label: Section order
            type: string
            list: true
          - name: sections
            label: Section spacing (px)
            type: object
            fields:
              - name: hero
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
              - name: showcase
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
              - name: projects
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
              - name: experience
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
              - name: about
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
              - name: contact
                type: object
                fields:
                  - { name: padTop, label: Space above, type: number }
                  - { name: padBottom, label: Space below, type: number }
          - name: experience
            type: object
            fields:
              - { name: split, label: Text / video split (% text), type: number }
              - { name: gap, label: Gap between entries, type: number }
          - name: projects
            type: object
            fields:
              - { name: gap, label: Gap between cards, type: number }
          - name: interests
            type: object
            fields:
              - { name: gap, label: Gap between cards, type: number }
              - { name: top, label: Space above, type: number }

  # =========================================================================
  # PROJECTS — one entry per project file
  # =========================================================================
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    filename: '{primary}.md'
    view:
      fields: [title, organization, date, draft]
      primary: title
      sort: [order, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string, description: "Optional one-line tagline shown under the title." }
      - { name: organization, label: Organization, type: string, description: "Company or club where this work happened (shown on cards)." }
      - name: date
        label: Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - { name: summary, label: Summary, type: text, required: true, description: "One-sentence summary used on project cards and previews." }
      - name: hero
        label: Hero image
        type: image
        required: true
        description: Main image shown on the project card and at the top of the page.
        options:
          input: src/assets/images/projects/{primary}
          output: '../../assets/images/projects/{primary}/{name}{extension}'
      - { name: heroAlt, label: Hero alt text, type: string, required: true, description: "Describe the image for screen readers." }

      # Layout knobs (Wix-like control without leaving the form)
      - name: heroFocalPoint
        label: Hero crop position
        type: select
        description: Where to anchor the hero image when it crops. Useful when faces or details get cut off.
        options:
          values:
            [
              'top-left',
              'top',
              'top-right',
              'left',
              'center',
              'right',
              'bottom-left',
              'bottom',
              'bottom-right',
            ]
      - name: heroAspect
        label: Hero shape
        type: select
        description: Shape of the hero image at the top of the page.
        options:
          values: [wide, standard, tall, square]
      - { name: heroZoom, label: Hero zoom, type: number, description: "1 is fit. Set by pinching the main photo in studio; anchors on the crop position." }
      - name: galleryLayout
        label: Gallery layout
        type: select
        description: Default width for gallery rows that don't set their own.
        options:
          values: [stacked, two-column, three-column]

      - name: gallery
        label: Gallery media
        type: object
        list: true
        default: []
        description: >
          Photos and videos for this project. Drag rows to reorder. A row with a
          Section renders inside that part of the write-up; the rest collect at
          the bottom of the page.
        fields:
          - name: image
            label: Photo
            type: image
            options:
              input: src/assets/images/projects/{primary}
              output: '../../assets/images/projects/{primary}/{name}{extension}'
          - { name: video, label: "Video instead of a photo", type: string, description: "Filename of an MP4 in public/videos/, e.g. ball-valve-test.mp4. Fill this in INSTEAD of Photo." }
          - name: poster
            label: "Video thumbnail (optional)"
            type: image
            options:
              input: src/assets/images/projects/{primary}
              output: '../../assets/images/projects/{primary}/{name}{extension}'
          - { name: alt, label: Alt text, type: string, description: "Describes the photo for screen readers. Used as the caption unless you set one." }
          - { name: caption, label: "Caption (optional)", type: string, description: "Shown under the photo. Leave blank to use the alt text." }
          - { name: section, label: "Place under which heading?", type: string, description: "A heading from the body, e.g. Testing. Blank puts it at the bottom. A heading that doesn't exist also falls to the bottom." }
          # Written by studio. Listed here so editing a gallery row in Pages
          # CMS doesn't drop fields it doesn't know about — a crop and a 3D
          # model would both vanish on the next CMS save.
          - { name: model, label: "3D model instead of a photo", type: string, description: "Filename of a .glb in public/models/, from npm run model. Fill this in INSTEAD of Photo." }
          - { name: zoom, label: Zoom, type: number, description: "1 is fit. Set by pinching the photo in studio; anchors on the crop point." }
          - name: aspect
            label: Shape
            type: select
            description: Crops the photo to a fixed shape. auto is 4:3 for half/third and natural height for full.
            options:
              values: [auto, "1/1", "4/3", "3/2", "16/9", "3/4", "2/3", "9/16"]
          - name: width
            label: Width
            type: select
            default: auto
            description: Full-width photos are never cropped - use it for tall sketches and wide CAD renders.
            options:
              values: [auto, full, half, third]
          - name: focal
            label: Crop position
            type: select
            default: center
            description: Which part survives the 4:3 crop at half and third width. No effect at full width.
            options:
              values: [top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right]

      # -------------------------------------------------------------------
      # WALKTHROUGH FIGURES
      # A figure is a claim with evidence: a headline, a picture, numbered
      # points, and callout markers pinned to the picture. A row with no
      # photo/video/model is a PLACEHOLDER — visible only on localhost, never
      # on the live site.
      # -------------------------------------------------------------------
      - *blocks
      - name: figures
        label: Walkthrough figures
        type: object
        list: true
        default: []
        description: >
          The slide-by-slide walkthrough. Drag rows to reorder. Each one sits
          under the heading you name, after the text. A row with no image shows
          as a labelled placeholder on localhost and is left off the live site.
        fields:
          - { name: section, label: "Place under which heading?", type: string, description: "A heading from the body — Problem, What I did, or Outcome. Blank puts it at the bottom." }
          - name: kind
            label: Kind
            type: select
            default: diagram
            description: Only changes the placeholder label and the frame treatment.
            options:
              values: [diagram, photo, comparison, data, model]
          - { name: title, label: Title, type: string, description: "Short name for the figure. Used as the caption and the alt text if you leave those blank." }
          - { name: takeaway, label: Takeaway, type: text, description: "One line saying what this figure proves. Shown above it in larger type — the slide headline. **bold** works." }
          - name: image
            label: Photo or diagram
            type: image
            options:
              input: src/assets/images/projects/{primary}
              output: '../../assets/images/projects/{primary}/{name}{extension}'
          - name: compare
            label: "Second image (for a before / after)"
            type: image
            description: Set Kind to comparison. Shown side by side with the first.
            options:
              input: src/assets/images/projects/{primary}
              output: '../../assets/images/projects/{primary}/{name}{extension}'
          - { name: beforeLabel, label: "Left label", type: string, description: "Defaults to Before." }
          - { name: afterLabel, label: "Right label", type: string, description: "Defaults to After." }
          - { name: video, label: "Video instead", type: string, description: "Filename of an MP4 in public/videos/." }
          - { name: model, label: "3D model instead", type: string, description: "Filename of a .glb in public/models/, from npm run model." }
          - name: poster
            label: "Video thumbnail (optional)"
            type: image
            options:
              input: src/assets/images/projects/{primary}
              output: '../../assets/images/projects/{primary}/{name}{extension}'
          - { name: alt, label: Alt text, type: string, description: "Describes the picture for screen readers." }
          - { name: caption, label: "Caption (optional)", type: string, description: "Shown under the figure, after its number." }
          - { name: plan, label: "What to draw (notes to self)", type: text, description: "Shown inside the placeholder on localhost so the intent survives until the diagram exists. NEVER published." }
          - name: aspect
            label: Shape
            type: select
            default: auto
            description: auto keeps the picture's natural height.
            options:
              values: [auto, "1/1", "4/3", "3/2", "16/9", "3/4", "2/3", "9/16"]
          - { name: focal, label: Crop position, type: string, description: "Set by dragging the photo in studio, e.g. 50% 40%. Keywords like top or center also work." }
          - { name: zoom, label: Zoom, type: number, description: "1 is fit. Anchors on the crop position." }
          - { name: compareFocal, label: "Crop position (second image)", type: string, description: "Set by dragging the after photo in studio." }
          - { name: compareZoom, label: "Zoom (second image)", type: number, description: "1 is fit." }
          - { name: points, label: "Points (numbered beside the figure)", type: string, list: true, default: [], description: "Point 1 pairs with callout 1, point 2 with callout 2, and so on. **bold** works." }
          - name: callouts
            label: Callout markers
            type: object
            list: true
            default: []
            description: >
              Numbered markers pinned to the picture. Position is a percentage
              of the frame, so it survives any crop or resize.
            fields:
              - { name: x, label: "Across (%)", type: number, description: "0 is the left edge, 100 the right." }
              - { name: y, label: "Down (%)", type: number, description: "0 is the top edge, 100 the bottom." }
              - { name: label, label: "Short label", type: string, description: "A couple of words shown next to the marker on wide screens. The full explanation goes in Points." }
              - name: place
                label: Label side
                type: select
                default: right
                description: Which side of the marker the label sits on. Flip it when a marker is near an edge.
                options:
                  values: [right, left, up, down]

      - { name: tools, label: "Tools / skills", type: string, list: true, default: [], description: "Listed as tags on the project page." }
      - { name: order, label: Display order, type: number, default: 0, description: "Lower numbers appear first. Ties broken by date (newer first)." }
      - { name: draft, label: "Draft (hide from live site)", type: boolean, default: false, description: "Toggle on to hide this project from the published site." }
      - name: body
        label: Body
        type: rich-text
        description: |
          Use ## headings for sections (Problem, What I did, Outcome, Gallery).
          Drop in images with the image button — they'll be uploaded next to the hero.
        options:
          image:
            input: src/assets/images/projects/{primary}
            output: '../../assets/images/projects/{primary}/{name}{extension}'

settings:
  content:
    merge: true
