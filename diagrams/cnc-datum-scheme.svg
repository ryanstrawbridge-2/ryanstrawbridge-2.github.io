<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1180" viewBox="0 0 1960 1180" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1960" height="1180" fill="#ffffff"/>

  <text x="400" y="190" font-size="22" letter-spacing="3" fill="#64748b" font-weight="700">TOP VIEW · BASE PLATE</text>
  <!-- base plate: raised end pads, recessed middle -->
  <rect x="60" y="215" width="1028" height="630" rx="6" fill="#dbe7f7" stroke="#1f2937" stroke-width="4"/>
  <rect x="62" y="217" width="168" height="626" fill="#c4d7f0"/>
  <rect x="918" y="217" width="168" height="626" fill="#c4d7f0"/>
  <line x1="230" y1="217" x2="230" y2="843" stroke="#64748b" stroke-width="2"/>
  <line x1="918" y1="217" x2="918" y2="843" stroke="#64748b" stroke-width="2"/>

  <!-- fixed plate footprint (green, dashed), concave front edge -->
  <path d="M260 250 L888 250 L888 470 Q574 410 260 470 Z" fill="#4caf50" fill-opacity="0.18" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="574" y="418" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="700">FIXED PLATE (on the dowels)</text>

  <!-- ram plate footprint, convex back edge -->
  <path d="M260 560 Q574 500 888 560 L888 700 L260 700 Z" fill="#4caf50" fill-opacity="0.18" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="12 8"/>
  <text x="574" y="690" font-size="22" fill="#2e7d32" text-anchor="middle" font-weight="700">RAM PLATE (slots)</text>

  <!-- cable between them -->
  <path d="M150 505 Q574 440 998 505" fill="none" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/>
  <text x="80" y="548" font-size="22" fill="#475569">cable</text>

  <!-- dowel holes B and C -->
  <line x1="440" y1="340" x2="718" y2="340" stroke="#334155" stroke-width="2" stroke-dasharray="10 8"/>
  <circle cx="440" cy="340" r="17" fill="#d32f2f" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="718" cy="340" r="17" fill="#d32f2f" stroke="#1f2937" stroke-width="2.5"/>
  <text x="440" y="388" font-size="20" fill="#475569" text-anchor="middle">dowel 1</text>
  <text x="718" y="388" font-size="20" fill="#475569" text-anchor="middle">dowel 2</text>
  <line x1="330" y1="148" x2="428" y2="324" stroke="#1f2937" stroke-width="2.5" marker-end="url(#tri)"/>
  <rect x="270" y="90" width="62" height="58" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="301" y="132" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">C</text>
  <line x1="1132" y1="700" x2="1094" y2="700" stroke="#1f2937" stroke-width="2.5" marker-end="url(#tri)"/>
  <rect x="1132" y="671" width="62" height="58" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="1163" y="713" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">B</text>

  <!-- shoulder bolts under the ram plate slots -->
  <rect x="371" y="586" width="36" height="74" rx="18" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <rect x="741" y="586" width="36" height="74" rx="18" fill="none" stroke="#2e7d32" stroke-width="2.5"/>
  <circle cx="389" cy="623" r="11" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <circle cx="759" cy="623" r="11" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="574" y="630" font-size="22" fill="#1f2937" text-anchor="middle">shoulder-bolt holes</text>

  <!-- toggle clamps push the ram plate back -->
  <rect x="364" y="760" width="50" height="60" rx="6" fill="#334155"/>
  <rect x="734" y="760" width="50" height="60" rx="6" fill="#334155"/>
  <line x1="389" y1="756" x2="389" y2="712" stroke="#b45309" stroke-width="4" marker-end="url(#push)"/>
  <line x1="759" y1="756" x2="759" y2="712" stroke="#b45309" stroke-width="4" marker-end="url(#push)"/>
  <text x="574" y="798" font-size="22" fill="#b45309" text-anchor="middle">toggle clamps push</text>

  <!-- side view -->
  <text x="60" y="905" font-size="22" letter-spacing="3" fill="#64748b" font-weight="700">SIDE VIEW</text>
  <rect x="60" y="927" width="1028" height="90" fill="#dbe7f7" stroke="#1f2937" stroke-width="4"/>
  <line x1="1155" y1="1085" x2="1070" y2="1020" stroke="#1f2937" stroke-width="2.5" marker-end="url(#tri)"/>
  <rect x="1155" y="1062" width="62" height="56" fill="#fff" stroke="#1f2937" stroke-width="3"/>
  <text x="1186" y="1103" font-size="34" font-weight="700" fill="#1f2937" text-anchor="middle">A</text>
  <text x="1236" y="1102" font-size="22" fill="#475569">base: what the plate sits on</text>

  <g fill="#1f2937">
    <text x="1218" y="110" font-size="26" letter-spacing="4" font-weight="700" fill="#64748b">SIDE EDGE · DATUM B</text>
    <rect x="1218" y="128" width="88" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <line x1="1240" y1="177" x2="1284" y2="177" stroke="#1f2937" stroke-width="3.5"/><line x1="1262" y1="177" x2="1262" y2="139" stroke="#1f2937" stroke-width="3.5"/>
    <rect x="1306" y="128" width="174" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1393" y="168" font-size="26" text-anchor="middle"></text>
    <rect x="1480" y="128" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1519" y="172" font-size="32" font-weight="700" text-anchor="middle">A</text>
    <text x="1218" y="230" font-size="26">Square to the base, so the bolt line measured</text>
    <text x="1218" y="264" font-size="26">off it stays square and the slots don’t bind.</text>
    <text x="1218" y="340" font-size="26" letter-spacing="4" font-weight="700" fill="#64748b">DOWEL HOLES · ONE IS DATUM C</text>
    <text x="1218" y="400" font-size="24">2X Ø</text>
    <rect x="1290" y="358" width="88" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <circle cx="1334" cy="389" r="17" fill="none" stroke="#1f2937" stroke-width="3"/><line x1="1310" y1="389" x2="1358" y2="389" stroke="#1f2937" stroke-width="3"/><line x1="1334" y1="365" x2="1334" y2="413" stroke="#1f2937" stroke-width="3"/>
    <rect x="1378" y="358" width="174" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1465" y="398" font-size="26" text-anchor="middle">Ø</text>
    <rect x="1552" y="358" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1591" y="402" font-size="32" font-weight="700" text-anchor="middle">A</text>
    <rect x="1630" y="358" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1669" y="402" font-size="32" font-weight="700" text-anchor="middle">B</text>
    <text x="1218" y="460" font-size="26">Located from the base and the edge. The fixed</text>
    <text x="1218" y="494" font-size="26">plate sits on these.</text>
    <text x="1218" y="570" font-size="26" letter-spacing="4" font-weight="700" fill="#64748b">SHOULDER-BOLT HOLES</text>
    <rect x="1218" y="588" width="88" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <circle cx="1262" cy="619" r="17" fill="none" stroke="#1f2937" stroke-width="3"/><line x1="1238" y1="619" x2="1286" y2="619" stroke="#1f2937" stroke-width="3"/><line x1="1262" y1="595" x2="1262" y2="643" stroke="#1f2937" stroke-width="3"/>
    <rect x="1306" y="588" width="174" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1393" y="628" font-size="26" text-anchor="middle">Ø</text>
    <rect x="1480" y="588" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1519" y="632" font-size="32" font-weight="700" text-anchor="middle">A</text>
    <rect x="1558" y="588" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1597" y="632" font-size="32" font-weight="700" text-anchor="middle">B</text>
    <rect x="1636" y="588" width="78" height="62" fill="#fff" stroke="#1f2937" stroke-width="3"/>
    <text x="1675" y="632" font-size="32" font-weight="700" text-anchor="middle">C</text>
    <text x="1218" y="690" font-size="26">The ram plate’s slots ride on these.</text>
    <text x="1218" y="780" font-size="26" letter-spacing="4" font-weight="700" fill="#64748b">CABLE CHANNEL</text>
    <text x="1218" y="826" font-size="26">No feature control frame: the green plates</text>
    <text x="1218" y="860" font-size="26">hold the cable; the base only clears it.</text>
      </g>
</svg>
